name: Build macOS grammars

on:
  pull_request:
    paths:
      - scripts/build_grammars.py
      - src/semble_grammars/grammars/sources.json

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - run: npm install -g tree-sitter-cli

      - run: uv run --no-project python scripts/build_grammars.py
