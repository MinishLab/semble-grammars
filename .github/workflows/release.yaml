name: Release to PyPI

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Build grammar bundle for macos-arm64
        run: uv run python tools/build_grammars.py

      - name: Build platform wheel
        run: uv run python tools/build_wheels.py

      - name: Smoke test built wheel
        run: uv run --with $(ls dist/*.whl) --no-project python tools/smoke_test.py

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-macos
          path: dist/*.whl

  build-linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Build grammar bundles for linux-x86_64 and linux-arm64
        run: uv run python tools/build_grammars.py --all

      - name: Build platform wheels
        run: uv run python tools/build_wheels.py

      - name: Smoke test linux-x86_64 wheel
        # Only the x86_64 wheel is tested here: this runner is x86_64, and the
        # arm64 wheel would need emulation (QEMU/Docker) to actually load.
        run: uv run --with dist/*manylinux2014_x86_64.whl --no-project python tools/smoke_test.py

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-linux
          path: dist/*.whl

  build-windows:
    name: Build Windows wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install tree-sitter CLI
        shell: bash
        run: npm install -g tree-sitter-cli

      - name: Build grammar bundle for windows-x86_64
        shell: bash
        run: uv run python tools/build_grammars.py

      - name: Build platform wheel
        shell: bash
        run: uv run python tools/build_wheels.py

      - name: Smoke test built wheel
        shell: bash
        run: uv run --with $(ls dist/*.whl) --no-project python tools/smoke_test.py

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-windows
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
