name: Release to PyPI

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build ${{ matrix.platform }} wheel
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Build grammar bundle for ${{ matrix.platform }}
        run: uv run python scripts/build_grammars.py

      - name: Build platform wheel
        run: uv run python scripts/build_wheels.py

      - name: Smoke test built wheel
        run: uv run --with $(ls dist/*.whl) --no-project python tests/verify_installed_wheel.py

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl

  build-linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Build grammar bundles for linux-x86_64 and linux-arm64
        run: uv run python scripts/build_grammars.py --all

      - name: Build platform wheels
        run: uv run python scripts/build_wheels.py

      - name: Smoke test linux-x86_64 wheel on manylinux2014
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo" -w /repo \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c '
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/0.11.30/install.sh \
                | env UV_UNMANAGED_INSTALL=/usr/local/bin sh
              uv run --python /opt/python/cp311-cp311/bin/python \
                --with /repo/dist/*manylinux2014_x86_64.whl \
                --no-project python /repo/tests/verify_installed_wheel.py
            '

      - name: Smoke test linux-arm64 wheel on manylinux2014
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/repo" -w /repo \
            quay.io/pypa/manylinux2014_aarch64 \
            bash -c '
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/0.11.30/install.sh \
                | env UV_UNMANAGED_INSTALL=/usr/local/bin sh
              uv run --python /opt/python/cp311-cp311/bin/python \
                --with /repo/dist/*manylinux2014_aarch64.whl \
                --no-project python /repo/tests/verify_installed_wheel.py
            '

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-linux
          path: dist/*.whl

  build-windows:
    name: Build ${{ matrix.platform }} wheel
    strategy:
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install tree-sitter CLI
        shell: bash
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Install MinGW-w64
        if: matrix.platform == 'windows-x86_64'
        run: choco install mingw --no-progress -y

      - name: Build grammar bundle for ${{ matrix.platform }}
        shell: bash
        run: uv run python scripts/build_grammars.py

      - name: Build platform wheel
        shell: bash
        run: uv run python scripts/build_wheels.py

      - name: Smoke test built wheel
        shell: bash
        run: uv run --with $(ls dist/*.whl) --no-project python tests/verify_installed_wheel.py

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
