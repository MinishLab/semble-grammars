[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semble-grammars"
description = "Locally-cached tree-sitter grammar bundle for Semble, with no runtime downloads."
authors = [{name = "MinishLab", email = "info@minishlab.com"}]
readme = { file = "README.md", content-type = "text/markdown" }
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.10"
keywords = ["tree-sitter", "grammars", "parsing", "semble"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
]

dependencies = [
    "tree-sitter>=0.23.1,<0.27",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pydoclint>=0.5.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]

[project.urls]
"Homepage" = "https://github.com/MinishLab/semble-grammars"
"Bug Reports" = "https://github.com/MinishLab/semble-grammars/issues"
"Source" = "https://github.com/MinishLab/semble-grammars"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["semble_grammars*"]
namespaces = true

[tool.setuptools.package-data]
semble_grammars = ["grammars/**/*"]

[tool.setuptools.dynamic]
version = {attr = "semble_grammars.version.__version__"}

[tool.ruff]
exclude = [".venv/"]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"scripts/**" = ["T20"]

[tool.ruff.lint]
select = [
    # Annotations: Enforce type annotations
    "ANN",
    # Complexity: Enforce a maximum cyclomatic complexity
    "C90",
    # Pydocstyle: Enforce docstrings
    "D",
    # Pycodestyle errors
    "E",
    # Remove unused imports
    "F",
    # Isort: Enforce import order
    "I",
    # Numpy: Enforce numpy style
    "NPY",
    # Print: Forbid print statements
    "T20",
]
ignore = [
    # Allow Any type
    "ANN401",
    # Pydocstyle ignores
    "D100", "D101", "D104", "D203", "D213", "D401",
]

[tool.pydoclint]
style = "sphinx"
exclude = "test_"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
require-return-section-when-returning-nothing = false

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "--strict-markers", "--cov=semble_grammars", "--cov-report=term-missing"]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "@abstractmethod"]

[tool.uv]
exclude-newer = "1 week"
